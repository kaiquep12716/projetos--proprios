<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Sriracha&display=swap" rel="stylesheet">
    
</head>
<body>
    <main>

        <div id="poke-left">
            <div id="estrutura-topo">
                <div class="verde" class="botao" ></div>
                <div class="botao"></div>
                <div class="botao"></div>
            </div>
            
            <h1>Pokedex</h1>

            <div id="image">
                <div class="imagem-pokemon"></div>
            </div>

            <div id="input">
                <form action="" id="formulario">

                    <input type="text" id="nome-pokemon" name="nome-pokemon" placeholder="Nome do Pokemon" required>

                    <input type="submit" value="Buscar">


                </form> 

                <button id="previous">
                    <svg xmlns="http://w3.org" viewBox="0 0 10 10" width="40" height="40" style="image-rendering: pixelated;"><path d="M5 2H6V3H5V2ZM4 3H5V4H4V3ZM3 4H4V5H3V4ZM2 5H3V6H2V5ZM3 6H4V7H3V6ZM4 7H5V8H4V7ZM5 8H6V9H5V8Z" fill="#111111"/></svg>
                </button>
                <button id="next">
                    <svg xmlns="http://w3.org" viewBox="0 0 10 10" width="40" height="40" style="image-rendering: pixelated;"><path d="M5 2H4V3H5V2ZM6 3H5V4H6V3ZM7 4H6V5H7V4ZM8 5H7V6H8V5ZM7 6H6V7H7V6ZM6 7H5V8H6V7ZM5 8H4V9H5V8Z" fill="#111111"/></svg>

                </button>

            </div>

        </div>

        <div id="dobradica"></div>


        <div id="poke-right">

            <div id="info">
                
                <ul>
                    
                </ul>   
                
            </div>

        </div>




    </main>



</body>

<script src="scripts.js"></script>

</html>
